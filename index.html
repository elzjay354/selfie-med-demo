<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Selfie-Med Agentic AI Demo (GG1)</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background: #f3f4f6; overflow: hidden; }
        .agentic-status { font-family: monospace; color: #059669; }
        .fade-enter { opacity: 0; transform: translateY(10px); }
        .fade-enter-active { opacity: 1; transform: translateY(0); transition: all 500ms; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [currentPage, setCurrentPage] = useState('welcome');
            const [status, setStatus] = useState('Initializing agent...');
            const [isPaused, setIsPaused] = useState(false);
            const synthesisRef = useRef(window.speechSynthesis);

            // 20-Page Narration Map
            const voiceMap = {
                'welcome': "Hello, I am your Selfie-Med nurse assistant. I'll help you manage your health data today.",
                'demo1': "First, let's verify your personal clinical profile and contact information.",
                'demo2': "Thank you. Now, please confirm your current physical metrics and health status.",
                'devices': "I am ready to sync your monitoring hardware. Please have your devices ready.",
                'scan1': "Scanning glucose monitor... analyzing the display for current levels.",
                'scan2': "Reading blood pressure cuff... capturing systolic and diastolic values.",
                'scan3': "Accessing smart scale... stabilizing weight and body mass index data.",
                'dev-img': "All device images have been captured and verified for clinical clarity.",
                'sum1': "Reviewing your personal data for accuracy before finalizing the record.",
                'sum2': "Device registration is complete. Your hardware is now linked to your profile.",
                'trends': "Analyzing your historical data. Your vitals show positive stability this week.",
                'appts': "Checking your schedule. You have a follow-up consultation coming up soon.",
                'med1': "Medication reminder. It is time for your scheduled morning dose.",
                'med2': "Please hold your pillbox up to the camera for prescription verification.",
                'med3': "Verifying medications... compliance logged for today's treatment plan.",
                'med4': "Medication management update complete. Your logs are now synchronized.",
                'concern': "I've analyzed your symptoms. Based on your readings, I've generated these recommendations.",
                'team': "I've prepared your health summary. Should I share this with your care team now?",
                'sending': "Establishing secure connection... transmitting data to your healthcare provider.",
                'complete': "All tasks complete. Your data is secure and your team has been updated. Goodbye!"
            };

            const pageOrder = [
                'welcome', 'demo1', 'demo2', 'devices', 'scan1', 'scan2', 'scan3', 
                'dev-img', 'sum1', 'sum2', 'trends', 'appts', 'med1', 'med2', 
                'med3', 'med4', 'concern', 'team', 'sending', 'complete'
            ];

            const speakAndHold = (text) => {
                return new Promise((resolve) => {
                    synthesisRef.current.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.pitch = 1.1; 
                    utterance.rate = 0.95;
                    utterance.onend = () => resolve();
                    synthesisRef.current.speak(utterance);
                });
            };

            const runFlow = async () => {
                for (let i = 0; i < pageOrder.length; i++) {
                    const page = pageOrder[i];
                    setCurrentPage(page);
                    setStatus(`Agentic Step: ${page.replace('-', ' ').toUpperCase()}...`);
                    
                    // The Logic Gate
                    await speakAndHold(voiceMap[page]);
                    
                    // Pause between steps
                    await new Promise(r => setTimeout(r, 800));
                    
                    // Handle decision point at 'team'
                    if (page === 'team') {
                        setStatus("Awaiting user decision...");
                        return; // Stop here for user input
                    }
                }
            };

            // Auto-Start
            useEffect(() => {
                runFlow();
            }, []);

            const handleToggle = () => {
                if (isPaused) {
                    synthesisRef.current.resume();
                    setIsPaused(false);
                } else {
                    synthesisRef.current.pause();
                    setIsPaused(true);
                }
            };

            return (
                <div className="flex flex-col h-screen bg-white max-w-md mx-auto border-x shadow-2xl overflow-hidden">
                    <div className="bg-blue-600 p-4 text-white flex justify-between items-center">
                        <h1 className="font-bold text-lg">Selfie-Med AI</h1>
                        <div className="flex gap-2">
                            <button onClick={handleToggle} className="p-1 hover:bg-blue-700 rounded">
                                {isPaused ? "▶️" : "⏸️"}
                            </button>
                            <button onClick={() => window.location.reload()} className="p-1 hover:bg-blue-700 rounded">🔄</button>
                        </div>
                    </div>

                    <div className="flex-1 p-6 flex flex-col items-center justify-center text-center">
                        <div className="mb-8 w-24 h-24 bg-blue-100 rounded-full flex items-center justify-center animate-pulse">
                            <span className="text-4xl">👩‍⚕️</span>
                        </div>
                        
                        <h2 className="text-2xl font-semibold text-gray-800 mb-4 capitalize">
                            {currentPage.replace('-', ' ')}
                        </h2>
                        
                        <p className="text-gray-600 mb-6 italic">
                            "{voiceMap[currentPage]}"
                        </p>

                        <div className="w-full bg-gray-100 rounded-lg p-4 text-left">
                            <div className="agentic-status text-xs mb-2 uppercase tracking-widest font-bold">AI Processing</div>
                            <div className="text-sm text-gray-700 leading-relaxed">
                                {status}
                            </div>
                        </div>
                    </div>

                    <div className="p-4 bg-gray-50 border-t">
                        <div className="flex justify-between mb-4">
                            {pageOrder.map((p, i) => (
                                <div key={i} className={`h-1.5 flex-1 mx-0.5 rounded-full ${pageOrder.indexOf(currentPage) >= i ? 'bg-blue-600' : 'bg-gray-300'}`}></div>
                            ))}
                        </div>
                        {currentPage === 'team' && (
                            <div className="flex gap-4">
                                <button onClick={() => setCurrentPage('sending')} className="flex-1 bg-green-600 text-white py-3 rounded-xl font-bold">Yes, Send Data</button>
                                <button className="flex-1 bg-gray-200 text-gray-800 py-3 rounded-xl font-bold">No, Keep Private</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
